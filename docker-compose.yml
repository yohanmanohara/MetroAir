version: '3.8'

services:
  web:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: dotnet-web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"  # Exposing port 5000 for local access
    volumes:
      - .:/app  # Mount the current directory to /app in the container

      - /app/obj  # Mount the obj directory to speed up rebuilds
      - /app/bin  # Mount the bin directory for faster access to build outputs
    environment:
      - ASPNETCORE_URLS=http://+:5000  # Ensures app listens on all network interfaces
      - ASPNETCORE_ENVIRONMENT=Development  # Ensure it's set to Development for hot reload
    networks:
      - webapp-network
    working_dir: /app  # Ensure the working directory is correct
    command: dotnet watch run --urls http://0.0.0.0:5000
 # This will use dotnet watch for hot-reloading


networks:
  webapp-network:
    driver: bridge
